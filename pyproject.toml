[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numerator-onboarding"
version = "0.1.0"
description = "Metadata-first onboarding to partitioned Numerator Parquet data"
requires-python = ">=3.10"
dependencies = ["pyarrow>=14", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
numerator-catalog = "numerator_onboarding.catalog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
